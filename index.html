<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contekan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23111' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath fill='%23fff' d='M32 13c-9.5 0-16 7-16 15.5 0 5.6 3 9.4 6 12.2 1.6 1.5 2.4 3.4 2.4 5.6V48h15.2v-1.7c0-2.2.8-4.1 2.4-5.6 3-2.8 6-6.6 6-12.2C48 20 41.5 13 32 13z'/%3E%3Cpath d='M25 53.5h14M27 58.5h10M27 33.5c1.4 2.2 3 3.2 5 3.2s3.6-1 5-3.2M32 3.5v4.5M12.5 11l3.2 3.2M51.5 11l-3.2 3.2M5.5 28.5H10M54 28.5h4.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --soft:#E9E9E6; --fg:#111111; --muted:#555555; --ink:#111111; --line:#111111; --hair:#D9D9D5;
  --inv-bg:#111111; --inv-fg:#FFFFFF;
  --warn-bg:#FFF1C2; --warn-fg:#5C4300; --bad-bg:#FBE3E1; --bad-fg:#8A1F17; --focus:#111111;
  --f-display:"Chewy","Comic Sans MS",cursive; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:920px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--ink);text-decoration:none}
.logo:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:12px}
.bulb{width:64px;height:64px;fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.bulb .glass{fill:var(--bg)}
.sub{font-size:.9rem;color:var(--muted);font-weight:600;margin-top:8px}
.date{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}
.search{position:relative;margin-top:20px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--ink)}
.search input{width:100%;font:inherit;font-size:1rem;padding:13px 44px 13px 46px;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:3px solid var(--focus);outline-offset:2px}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink);font-size:1.3rem;width:34px;height:34px;border-radius:50%;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips:empty{display:none}
.chip{font:inherit;font-size:.82rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip:hover,.chip[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg)}
.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.banner{margin-top:16px;font-size:.85rem;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);font-weight:600}
.banner.bad{background:var(--bad-bg);color:var(--bad-fg)}
.count{margin:22px 2px 10px;font-size:.85rem;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;min-height:96px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);color:var(--fg);transition:background-color .12s ease,color .12s ease,transform .12s ease}
.card:hover,.card:active{background:var(--inv-bg);color:var(--inv-fg);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3rem;line-height:1.15;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.card .snip{font-size:.8rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.art svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stale{font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg)}
mark{background:var(--warn-bg);color:var(--warn-fg);border-radius:3px;padding:0 2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);font-weight:600}
.back{font:inherit;font-weight:800;border:0;background:transparent;color:var(--fg);cursor:pointer;padding:8px 4px}
.back:focus-visible{outline:3px solid var(--focus);border-radius:8px}
.hero{margin-top:10px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px 24px}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.05;text-wrap:balance}
.hero .full{color:var(--muted);font-weight:700;margin-top:6px}
.hero p{margin:12px 0 0;max-width:62ch;white-space:pre-line}
.hero .art{display:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg)}
.sec{margin-top:26px}
.sec h3{font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.kpi{background:var(--soft);border-radius:14px;padding:14px}
.kpi .v{margin-top:2px;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v.todo{color:var(--muted);font-weight:600;font-size:.95rem}
.kpi .l{font-size:.84rem;color:var(--muted);font-weight:600}
ul.hl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.hl li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px 12px 38px;position:relative;white-space:pre-line}
ul.hl li::before{content:"";position:absolute;left:15px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.qa details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.qa summary{cursor:pointer;padding:12px 14px;font-weight:800}
.qa details p{margin:0;padding:0 14px 14px;max-width:68ch;white-space:pre-line}
.foot{margin-top:26px;font-size:.82rem;color:var(--muted);font-weight:600;border-top:1.5px solid var(--hair);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px 20px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="logo" href="#" id="home-link">
      <svg class="bulb" viewBox="0 0 64 64" aria-hidden="true"><path class="glass" d="M32 13c-9.5 0-16 7-16 15.5 0 5.6 3 9.4 6 12.2 1.6 1.5 2.4 3.4 2.4 5.6V48h15.2v-1.7c0-2.2.8-4.1 2.4-5.6 3-2.8 6-6.6 6-12.2C48 20 41.5 13 32 13z"/><path d="M25 53.5h14M27 58.5h10"/><path d="M27 33.5c1.4 2.2 3 3.2 5 3.2s3.6-1 5-3.2"/><path d="M32 3.5v4.5M12.5 11l3.2 3.2M51.5 11l-3.2 3.2M5.5 28.5H10M54 28.5h4.5"/><path d="M23.5 25.5c.8-3 3-5.2 6-6" stroke-width="2.6"/></svg>
      <span>Contekan</span>
    </a>
    <div class="sub">Pencerah Saat Ditanya Pak BuSan</div>
    <div class="date" id="today"></div>
  </header>

  <section id="list-view">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari program, angka, atau kata kunci… (mis. MoU, UMKM, Belanda)" autocomplete="off" aria-label="Cari">
      <button class="clear" id="clear" aria-label="Hapus pencarian" hidden>×</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="status"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="detail-view" hidden></section>
</div>

<script>
// Isi aplikasi dibaca dari Google Sheets (tab Program dan Isi).
// Jika Sheets tidak bisa diakses, aplikasi memakai cadangan data/programs.json.
const SHEET_ID = '1lMxNH_I_WVroNFj51SqFH_iCzlElwYa-XSXc2lQ0_54';
const STALE_DAYS = 30;
const ART = {
  expo:'<svg viewBox="0 0 120 100"><path d="M14 86h92"/><path d="M22 86V40l38-20 38 20v46"/><path d="M22 40h76"/><rect x="34" y="52" width="18" height="34"/><rect x="66" y="52" width="20" height="14"/><path d="M60 20V8l14 5-14 5"/><circle cx="96" cy="16" r="6"/><path d="M8 30q6-6 12 0"/></svg>',
  campus:'<svg viewBox="0 0 120 100"><path d="M60 14 12 34l48 20 48-20z"/><path d="M30 42v22q30 16 60 0V42"/><path d="M104 36v26"/><circle cx="104" cy="66" r="4"/><path d="M50 82h20M60 70v12"/><path d="M84 84l6-10 6 10"/></svg>',
  ship:'<svg viewBox="0 0 120 100"><path d="M12 66h96l-12 18H24z"/><rect x="30" y="44" width="18" height="22"/><rect x="50" y="44" width="18" height="22"/><rect x="40" y="26" width="18" height="18"/><path d="M80 66V38h12v28"/><path d="M8 92q8-6 16 0t16 0 16 0 16 0 16 0 16 0"/><path d="M98 18q4-8 12-4"/></svg>',
  scale:'<svg viewBox="0 0 120 100"><path d="M60 12v72M36 86h48"/><path d="M22 28h76"/><path d="M22 28 10 56h24z"/><path d="M98 28 86 52h24z"/><path d="M10 56q12 10 24 0M86 52q12 10 24 0"/><path d="M66 8l6-4M54 8l-6-4"/></svg>',
  shield:'<svg viewBox="0 0 120 100"><path d="M60 8 26 20v26c0 22 14 38 34 46 20-8 34-24 34-46V20z"/><path d="m45 50 10 10 22-22"/><path d="M104 20l8-6M104 34h10M10 30h8"/></svg>',
  globe:'<svg viewBox="0 0 120 100"><circle cx="56" cy="52" r="36"/><path d="M20 52h72M56 16c-14 18-14 54 0 72M56 16c14 18 14 54 0 72"/><path d="M84 18l18-8 4 18"/><path d="M102 10 74 40"/></svg>',
  local:'<svg viewBox="0 0 120 100"><path d="M10 50h34v34H10z"/><path d="M6 50l7-14h28l7 14"/><path d="M22 84V66h10v18"/><circle cx="90" cy="50" r="22"/><path d="M68 50h44M90 28c-8 10-8 34 0 44M90 28c8 10 8 34 0 44"/><path d="M50 60q12-20 30-16"/><path d="m74 38 6 6-8 4"/></svg>',
  chart:'<svg viewBox="0 0 120 100"><path d="M14 86h92M14 86V14"/><rect x="26" y="56" width="14" height="30"/><rect x="50" y="40" width="14" height="46"/><rect x="74" y="26" width="14" height="60"/><path d="M24 44 50 28l22 8 28-22"/></svg>',
  doc:'<svg viewBox="0 0 120 100"><path d="M30 8h44l18 18v66H30z"/><path d="M74 8v18h18"/><path d="M42 42h38M42 54h38M42 66h26"/><path d="m86 70 18-18 6 6-18 18h-6z"/></svg>'
};
const TONES = ['lilac','blue','sand','sage','rose','teal','butter'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? '–' : d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
const isStale = s => { const d = new Date(s); return !isNaN(d) && (Date.now() - d) / 864e5 > STALE_DAYS; };
$('#today').textContent = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

let programs = [], filterStale = false;

function clean(d, i){
  const arr = v => Array.isArray(v) ? v : [];
  return {
    id: String(d.id || 'program-' + i), title: d.title || '(tanpa judul)', full: d.full || '',
    art: ART[d.art] ? d.art : 'doc', tone: TONES.includes(d.tone) ? d.tone : TONES[i % TONES.length],
    updated: d.updated || '', summary: d.summary || '', source: d.source || '',
    tags: arr(d.tags), kpis: arr(d.kpis), highlights: arr(d.highlights), qa: arr(d.qa)
  };
}
function haystack(p){
  return [p.title,p.full,p.summary,p.source,...p.tags,...p.highlights,...p.kpis.flatMap(k=>[k.label,k.value]),...p.qa.flatMap(x=>[x.q,x.a])].filter(Boolean);
}
function mark(text, q){
  const t = esc(text); if(!q) return t;
  const re = new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return t.replace(re,'<mark>$1</mark>');
}

function renderList(){
  const raw = $('#q').value.trim(), q = norm(raw);
  $('#clear').hidden = !raw;
  const staleCount = programs.filter(p => isStale(p.updated)).length;
  $('#chips').innerHTML = staleCount
    ? `<button class="chip" id="stale-chip" aria-pressed="${filterStale}">Perlu diperbarui (${staleCount})</button>` : '';
  const rows = programs.filter(p => !filterStale || isStale(p.updated)).map(p => {
    if(!q) return {p, snip: null};
    const hit = haystack(p).find(s => norm(s).includes(q));
    return hit ? {p, snip: hit} : null;
  }).filter(Boolean);
  $('#count').textContent = q ? `${rows.length} program cocok dengan "${raw}"` : `${rows.length} program`;
  $('#grid').innerHTML = rows.length ? rows.map(({p,snip}) => `
    <button class="card" style="--tone:var(--c-${p.tone})" data-id="${esc(p.id)}">
      <h2>${mark(p.title,raw)}</h2>
      ${snip ? `<div class="snip">${mark(snip, raw)}</div>` : ''}
    </button>`).join('') : `<div class="empty">Tidak ada program yang cocok dengan "${esc(raw)}".</div>`;
}

function renderDetail(p){
  const v = $('#detail-view');
  v.style.setProperty('--tone', `var(--c-${p.tone})`);
  v.innerHTML = `
    <button class="back" data-act="home">← Kembali ke daftar</button>
    <div class="hero">
      <div><h1>${esc(p.title)}</h1>${p.full?`<div class="full">${esc(p.full)}</div>`:''}${p.summary?`<p>${esc(p.summary)}</p>`:''}
      ${p.tags.length?`<div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}</div>
      <div class="art" aria-hidden="true">${ART[p.art]}</div>
    </div>
    ${isStale(p.updated)?`<div class="banner">Isi program ini belum diperbarui lebih dari ${STALE_DAYS} hari. Cek apakah ada data terbaru.</div>`:''}
    ${p.kpis.length?`<div class="sec"><h3>Angka kunci</h3><div class="kpis">${p.kpis.map(k=>`
      <div class="kpi"><div class="l">${esc(k.label)}</div><div class="v ${k.value?'':'todo'}">${k.value?esc(k.value):'Isi data terbaru'}</div></div>`).join('')}</div></div>`:''}
    <div class="sec"><h3>Highlight</h3>
      ${p.highlights.length?`<ul class="hl">${p.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:'<div class="empty">Belum ada highlight.</div>'}</div>
    ${p.qa.length?`<div class="sec qa"><h3>Pertanyaan yang sering muncul</h3>${p.qa.map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join('')}</div>`:''}
    <div class="foot">${p.source?`<span>Sumber / PIC: ${esc(p.source)}</span>`:''}<span>Terakhir diperbarui: ${fmtDate(p.updated)}</span></div>`;
}

function route(){
  const p = programs.find(x => x.id === decodeURIComponent(location.hash.slice(1)));
  $('#list-view').hidden = !!p; $('#detail-view').hidden = !p;
  if(p){ renderDetail(p); window.scrollTo(0,0); } else renderList();
}

document.addEventListener('click', e => {
  const t = e.target.closest('.card,#stale-chip,[data-act]'); if(!t) return;
  if(t.matches('.card')) location.hash = t.dataset.id;
  else if(t.id === 'stale-chip'){ filterStale = !filterStale; renderList(); }
  else if(t.dataset.act === 'home') location.hash = '';
});
$('#q').addEventListener('input', renderList);
$('#clear').onclick = () => { $('#q').value = ''; renderList(); $('#q').focus(); };
$('#home-link').onclick = e => { e.preventDefault(); location.hash = ''; };
window.addEventListener('hashchange', route);

// CSV sederhana: mendukung tanda kutip, koma dan baris baru di dalam sel.
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if(c === '"') q = false;
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === ',') { row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if(cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
// Baris pertama = judul kolom; dicocokkan berdasarkan nama, bukan posisi.
function readTab(rows){
  const head = (rows.shift() || []).map(h => norm(h).trim());
  const col = name => head.indexOf(norm(name));
  return rows.filter(r => r.some(v => v.trim())).map(r => name => (r[col(name)] ?? '').trim());
}
async function sheetTab(name){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`);
  if(!r.ok) throw new Error(r.status);
  const text = await r.text();
  if(text.trimStart().startsWith('<')) throw new Error('bukan CSV');
  return readTab(parseCSV(text));
}
async function loadFromSheet(){
  const [prog, isi] = await Promise.all([sheetTab('Program'), sheetTab('Isi')]);
  const list = prog.filter(g => g('ID') && g('Nama program')).map(g => ({
    id: g('ID'), title: g('Nama program'), full: g('Subjudul'), summary: g('Ringkasan'),
    tags: g('Kata kunci').split(',').map(s => s.trim()).filter(Boolean),
    art: g('Gambar'), tone: g('Warna'), source: g('Sumber / PIC'), updated: g('Terakhir diperbarui'),
    kpis: [], highlights: [], qa: []
  }));
  if(!list.length) throw new Error('tab Program kosong');
  const byId = Object.fromEntries(list.map(p => [p.id, p]));
  isi.forEach(g => {
    const p = byId[g('ID program')]; if(!p) return;
    const kind = norm(g('Jenis')), title = g('Judul / Pertanyaan'), body = g('Isi / Nilai');
    if(kind.startsWith('angka')) p.kpis.push({label: title, value: body});
    else if(kind.startsWith('tanya')) p.qa.push({q: title, a: body});
    else if(body) p.highlights.push(body);
  });
  return list;
}
async function loadFallback(){
  const r = await fetch('data/programs.json', {cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

(async () => {
  let list;
  try { list = await loadFromSheet(); }
  catch {
    try {
      list = await loadFallback();
      $('#status').innerHTML = '<div class="banner">Google Sheets tidak bisa diakses, jadi aplikasi menampilkan data cadangan yang mungkin belum terbaru. Pastikan Sheets dibagikan ke "Siapa saja yang memiliki link".</div>';
    } catch {
      $('#status').innerHTML = '<div class="banner bad">Data tidak bisa dimuat. Periksa koneksi internet lalu muat ulang halaman.</div>';
      return;
    }
  }
  programs = (Array.isArray(list) ? list : []).map(clean);
  route();
})();
</script>
</body>
</html>
